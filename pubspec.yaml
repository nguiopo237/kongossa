  firebase_auth: ^6.1.4
  firebase_storage: ^13.0.6
  get: ^4.6.5
  responsive_sizer: ^3.2.0
  animated_gradient_background: ^0.0.1
  shared_preferences: ^2.5.4
  cloudinary: ^1.2.0
  mime: ^2.0.0
